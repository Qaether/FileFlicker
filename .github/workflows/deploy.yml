name: Deploy FileFlicker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fileflicker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: elbepqrahykhefjdlnqn
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      APP_ORIGIN: ${{ vars.FILEFLICKER_APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Type-check and build public assets
        run: |
          set -eu
          npm ci
          npm run build
      - name: Check deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          : "${SUPABASE_ACCESS_TOKEN:?Configure the Supabase Actions secret}"
          : "${CLOUDFLARE_API_TOKEN:?Configure the Cloudflare Pages Actions secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the Cloudflare account variable}"
          : "${PAGES_PROJECT:?Configure the Pages project variable}"
          : "${APP_ORIGIN:?Configure the production origin variable}"
          node -e 'const u = new URL(process.env.APP_ORIGIN); if (u.protocol !== "https:" || u.origin !== process.env.APP_ORIGIN) throw Error("Expected an HTTPS origin with no trailing slash");'
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Configure origin and deploy API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -eu
          supabase secrets set "APP_ORIGIN=$APP_ORIGIN" --remote="$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy files --remote="$SUPABASE_PROJECT_REF" --use-api --yes
          supabase functions deploy mcp --remote="$SUPABASE_PROJECT_REF" --use-api --yes
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H "Origin: $APP_ORIGIN" -H 'Access-Control-Request-Method: POST' \
            "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/files")
          test "$status" = 204
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main
